# Round 2 fold captioner (cross-fitting): b_blip_full + top 4 ViT layers trained (lr x0.1) + 6 epochs
# (+ answer-weighted loss for variant B: scripts/kaggle_blip_fold_v2.sh sets answer_weight: 3.0).
# Kaggle 2x T4; scripts/make_fold_qd.py fills the fold's data, rows and save_dir.
seed: 42
blip_model: Salesforce/blip-image-captioning-base
train_captions_json: /kaggle/input/datasets/mahdirouzmeh/questiondependentcaptions/vqa_v2_question_dependent_captions_train2014.json
train_images_dir: "/kaggle/input/datasets/mnhlfuch/vqa-v2/VQA v2/VQA v2/Images/train2014"
train_image_filename_template: "COCO_train2014_{image_id:012d}.jpg"

train_row_range: [0, 264318]
val_row_range: [264318, 267321]
test_row_range: [267321, 277318]

prompt: "question: {question} caption:"
max_prompt_tokens: 32
max_caption_tokens: 32
image_size: 384
freeze_vision: true
unfreeze_vision_layers: 4    # top 4 of 12 ViT layers + post_layernorm are trained
vision_lr_scale: 0.1         # their lr = 0.1 x learning_rate
answer_weight: 1.0           # 1 = plain loss; variant B: 3.0 (answer words in the caption count x3)

save_dir: /kaggle/working/model_b/b_blip_fold_v2
batch_size: 24           # per GPU; x2 accumulation x2 GPUs = 96 global, as before (ViT activations need memory)
grad_accum_steps: 2
eval_batch_size: 96
num_workers: 2
epochs: 6
learning_rate: 0.00003
weight_decay: 0.05
warmup_steps: 1000
grad_clip: 1.0
label_smoothing: 0.1
use_amp: true
val_beam_size: 1
max_hours: 10.5          # stop cleanly before Kaggle 12 h; resume with --continue
ddp: true
ddp_backend: nccl
ddp_find_unused_parameters: false
