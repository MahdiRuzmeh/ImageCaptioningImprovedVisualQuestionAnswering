# Model B — BLIP-base (ViT-B/16 frozen + BERT text decoder) fine-tuned with the question as prompt:
#   [DEC] question: <question> caption: <caption> [SEP]   (loss only on the caption tokens)
# Same file, ok filter and image-disjoint split as model A (configs/a_full_butd.yaml), so test tables compare.
# Kaggle 2x T4, Kaggle paths below; scripts/kaggle_model_b.sh uses them (searches /kaggle/input only if one is missing).
#   torchrun --nproc_per_node=2 train_blip.py --config configs/b_blip_full.yaml --continue
#   python train_blip.py --config configs/b_blip_full.yaml --test --beam 3
seed: 42
blip_model: Salesforce/blip-image-captioning-base
train_captions_json: /kaggle/input/datasets/mahdirouzmeh/questiondependentcaptions/vqa_v2_question_dependent_captions_train2014.json
train_images_dir: "/kaggle/input/datasets/mnhlfuch/vqa-v2/VQA v2/VQA v2/Images/train2014"
train_image_filename_template: "COCO_train2014_{image_id:012d}.jpg"

train_row_range: [0, 264318]
val_row_range: [264318, 267321]
test_row_range: [267321, 277318]

prompt: "question: {question} caption:"
max_prompt_tokens: 32
max_caption_tokens: 32
image_size: 384
freeze_vision: true

save_dir: /kaggle/working/model_b/b_blip_full
batch_size: 48           # per GPU → 96 global
eval_batch_size: 96
num_workers: 2           # per GPU process (Kaggle has 4 CPUs)
epochs: 4
learning_rate: 0.00003
weight_decay: 0.05
warmup_steps: 1000
grad_clip: 1.0
grad_accum_steps: 1
label_smoothing: 0.1
use_amp: true
val_beam_size: 1
max_hours: 10.5          # stop cleanly before Kaggle 12 h (leaves time for the test decode); resume with --continue
ddp: true
ddp_backend: nccl
ddp_find_unused_parameters: false
